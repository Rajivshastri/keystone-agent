[project]
name = "keystone-agent"
version = "0.1.0"
description = "Keystone reconciliation agent — on-premise, hybrid SaaS"
requires-python = ">=3.12,<3.13"
authors = [
  { name = "GoldStandard Wealth" }
]
readme = "README.md"
dependencies = [
  # Local UI / API
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "python-multipart>=0.0.20",  # form parsing in FastAPI
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "jinja2>=3.1.4",

  # HTTP client (for agent -> control plane)
  "httpx>=0.27.2",

  # Windows-specific: DPAPI via pywin32, service wrapper
  "pywin32>=308; sys_platform == 'win32'",

  # Core reconciliation engine deps (ported from wealthspectrum-helper)
  "openpyxl>=3.1.0",
  "xlrd>=2.0.1",
  "xlwt>=1.3.0",
  "pdfplumber>=0.9.0",
  "requests>=2.31.0",
  "cryptography>=41.0.0",
  "msal>=1.24.0",
  "beautifulsoup4>=4.12.0",
  "lxml>=4.9.0",
  "msoffcrypto-tool>=5.0.0",
  "pandas>=2.0.0",
  "pyzipper>=0.3.6",
  "apscheduler>=3.10.0",
  "xlrd>=2.0.1",  # for .xls parsing in the engine
  "anthropic>=0.40.0",  # fallback PDF parser in parsers/broker_pdf.py

  # Outbox persistence (offline resilience)
  "sqlalchemy>=2.0.30",
  "aiosqlite>=0.20.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.8.0",
  "mypy>=1.13.0",
]
build = [
  "pyinstaller>=6.11.0",
]

[project.scripts]
keystone-agent = "agent.main:main"
keystone-service = "agent.service:main"

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent*", "core*", "parsers*"]
exclude = ["installer*", "tests*", "data*", "logs*"]

[tool.setuptools]
# ws_downloader.py lives at the repo root as a single module, not a package
py-modules = ["ws_downloader"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
ignore = ["E501"]  # line length handled by formatter

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
disallow_untyped_defs = true
